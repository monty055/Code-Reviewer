[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewer-agent"
version = "0.1.0"
description = "Source Code Reviewer Agent: compares source code against a requirements document (User Story / PRD / BRD) and produces an acceptance-criteria coverage report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.0.0"]
web = ["flask>=3.0.0"]
docs = ["python-docx>=1.0.0", "pypdf>=4.0.0"]
export = ["reportlab>=4.0.0"]
dev = ["pytest>=7.0.0", "flask>=3.0.0", "python-docx>=1.0.0", "pypdf>=4.0.0", "reportlab>=4.0.0"]

[project.scripts]
reviewer-agent = "reviewer_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reviewer_agent = ["templates/*.html", "static/**/*"]
